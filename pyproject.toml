[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agentharness"
version = "0.1.0"
description = "A hand-written LLM tool-calling harness, built to be explained."
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.7",
    "openai>=3.0",
    "tiktoken>=0.9",
    "fastapi>=0.115",
]

[project.optional-dependencies]
# Each milestone adds only what it actually imports: pyyaml (M8).
dev = [
    "pytest>=8.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/agentharness"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
